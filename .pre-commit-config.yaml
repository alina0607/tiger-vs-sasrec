# Checks that run on every commit. Install once per clone: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # mypy runs in the project environment (uv), so it sees the real dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy recsys tests scripts
        language: system
        types: [python]
        pass_filenames: false
      # Redraws docs/classes.* with cartograph. When the diagram changes, the
      # commit stops so the new files can be reviewed and added with git add.
      - id: class-diagram
        name: class diagram (docs/classes.*)
        entry: uv run python scripts/update_diagram.py
        language: system
        files: ^(recsys/.*\.py|docs/classes\.layout\.json)$
        pass_filenames: false

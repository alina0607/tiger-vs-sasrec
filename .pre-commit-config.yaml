# Checks that run on every commit. Install once per clone: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # mypy runs in the project environment (uv), so it sees the real dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy recsys tests
        language: system
        types: [python]
        pass_filenames: false

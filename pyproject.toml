[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-vs-sasrec"
version = "0.1.0"
description = "SASRec vs TIGER (generative retrieval with Semantic IDs) on Amazon Beauty, built from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.2"]   # item text -> Sentence-T5 vectors (step 8)

[tool.setuptools.packages.find]
include = ["recsys*"]

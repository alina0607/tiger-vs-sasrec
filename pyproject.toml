[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-vs-sasrec"
version = "0.1.0"
description = "SASRec vs TIGER (generative retrieval with Semantic IDs) on Amazon Beauty, built from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.2"]   # item text -> Sentence-T5 vectors (step 8)

[tool.setuptools.packages.find]
include = ["recsys*"]

# On Linux (including CI) install the CPU build of torch: the default Linux wheel
# pulls several gigabytes of CUDA libraries that a machine without a GPU never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PT"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Test functions take pytest fixtures and return nothing; annotating every
# one adds noise without catching bugs.
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
